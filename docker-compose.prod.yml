# Cấu hình chạy trên server thật. Lệnh: docker compose -f docker-compose.prod.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    container_name: rental_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
      - reverb

  nginx:
    image: nginx:alpine
    container_name: rental_nginx
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: rental_php
    container_name: rental_app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - redis

  reverb:
    image: rental_php
    container_name: rental_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - redis

  queue:
    image: rental_php
    container_name: rental_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --sleep=1
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - redis
      - reverb

  # Chạy các lệnh hẹn giờ của Laravel (schedule) mỗi phút
  scheduler:
    image: rental_php
    container_name: rental_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: rental_db
    restart: unless-stopped
    # Giảm RAM cho máy 1GB
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  redis:
    image: redis:7-alpine
    container_name: rental_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config: